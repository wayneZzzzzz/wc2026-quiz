services:
  - type: web
    name: wc2026-quiz
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ODDS_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
